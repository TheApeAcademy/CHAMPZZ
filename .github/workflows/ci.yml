name: CI

on:
  pull_request:
  push:
    # The branch Vercel deploys to production. Pull requests cover everything else.
    branches: [claude/loving-lamport-3obux3]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Database (pgTAP) + end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start local Supabase
        # Storage (uploads) and Mailpit (sign-up and reset emails) stay on: the end-to-end tests use both.
        run: npx supabase start -x studio,logflare,vector,imgproxy,edge-runtime,realtime,postgres-meta,supavisor

      - name: Database tests (RLS, org isolation, lifecycle)
        id: db
        # Keep going so the end-to-end results are visible too; the job still fails below.
        continue-on-error: true
        run: npx supabase test db

      - name: Write test environment
        run: ./scripts/ci/write-env.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: End-to-end tests
        id: e2e
        continue-on-error: true
        run: npx playwright test --trace retain-on-failure

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots)
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Fail if any test suite failed
        if: steps.db.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "Database tests: ${{ steps.db.outcome }}"
          echo "End-to-end tests: ${{ steps.e2e.outcome }}"
          exit 1
